name: Validate firmware packages
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate all release folders
        run: |
          for folder in releases/*; do
            python scripts/package_release.py "$folder"
          done
